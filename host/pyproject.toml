[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detlab"
version = "0.1.0"
description = "Determinism regression harness for QNX 8.0: latency probes, reports, CI gates"
requires-python = ">=3.10"
license = { file = "../LICENSE" }

[project.scripts]
detlab = "detlab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["detlab*"]
